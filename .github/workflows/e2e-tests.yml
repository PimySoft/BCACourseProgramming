name: E2E Tests (Legacy - Local Emulator)

# DISABLED: Replaced by ci-browserstack.yml which uses BrowserStack real devices
# on:
#   push:
#     branches: [ main, master, develop ]
#   pull_request:
#     branches: [ main, master, develop ]
#   workflow_dispatch:
on:
  workflow_dispatch:  # Only manual runs allowed

jobs:
  e2e-tests:
    name: Appium E2E Tests
    runs-on: macos-latest
    
    strategy:
      matrix:
        api-level: [33]
        target: [default]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Create Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: Nexus 6
          script: |
            echo "Emulator is ready"
            adb devices

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Verify APK exists
        run: |
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK not found!"
            exit 1
          fi
          ls -lh android/app/build/outputs/apk/debug/

      - name: Install Appium
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2

      - name: Start Appium server
        run: |
          appium --log-level info --log ./logs/appium.log &
          sleep 10
          echo "Appium server started"

      - name: Wait for emulator to be ready
        run: |
          adb wait-for-device
          adb shell 'while [[ -z $(getprop sys.boot_completed | tr -d '\''\r'\'') ]]; do sleep 1; done'
          adb shell input keyevent 82
          echo "Emulator is fully booted"

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Generate Allure report
        if: always()
        run: |
          npm run allure:generate || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/**/*.xml
            allure-results/**/*
            screenshots/**/*
            logs/**/*.log
          retention-days: 30

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          retention-days: 7

      - name: Check test results
        if: always()
        run: |
          if [ -f "test-results/results-0-0.xml" ]; then
            echo "Test results found"
          else
            echo "No test results found"
          fi

