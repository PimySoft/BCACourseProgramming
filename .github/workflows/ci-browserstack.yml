name: CI/CD with BrowserStack

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  test:
    name: Build & Test on BrowserStack
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          target: default
          arch: x86_64

      - name: 📥 Install dependencies
        run: npm ci

      - name: 💾 Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔨 Build Android APK
        timeout-minutes: 25
        run: |
          cd android
          chmod +x gradlew
          echo "Starting Gradle build (first build may take 20-25 minutes due to NDK installation)..."
          ./gradlew assembleDebug --no-daemon --stacktrace || {
            echo "Build failed, checking logs..."
            exit 1
          }
          echo "Build completed successfully"
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK not found after build!"
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/
          cd ..
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"

      - name: 🧪 Run E2E Tests on BrowserStack
        run: npm run test:e2e:browserstack:all
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_ID: ${{ secrets.BROWSERSTACK_APP_ID }}

      - name: 📊 Generate Allure Report
        if: always()
        run: |
          npx allure-commandline generate allure-results --clean -o allure-report || echo "Allure report generation skipped (no results)"

      - name: 📤 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            allure-results/
            test-results/
            screenshots/
          retention-days: 7
          if-no-files-found: ignore

